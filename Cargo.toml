# REQUIEM workspace manifest.
#
# This is a *virtual* manifest: the workspace root defines no package of its
# own. The canonical, installable REQUIEM binary lives in `crates/cli` and is
# named `requiem` (see crates/cli/Cargo.toml). Keeping the root package-less
# guarantees that `cargo build --release` builds every workspace member and
# that exactly one `requiem` executable exists in `target/release/`.

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# config
toml = "0.8"
dirs = "5"

# terminal / TUI
crossterm = "0.27"
ratatui = "0.29"
clap = { version = "4", features = ["derive", "wrap_help"] }

# HTTP / model client
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio-stream = "0.1"
bytes = "1"

# crypto / hashing
sha2 = "0.10"

# error handling
thiserror = "1"
anyhow = "1"
color-eyre = "0.6"

# logging / diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# persistence
rusqlite = { version = "0.31", features = ["bundled"] }

# utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
walkdir = "2"
tempfile = "3"
textwrap = "0.16"
unicode-width = "0.2"

# clipboard (cross-platform native access: X11, Wayland, Win32, macOS)
arboard = { version = "3", default-features = false }

# secrets (masked terminal input)
rpassword = "7"

# internal crates
requiem-core = { path = "crates/core" }
requiem-model = { path = "crates/model" }
requiem-orchestration = { path = "crates/orchestration" }
requiem-tools = { path = "crates/tools" }
requiem-permissions = { path = "crates/permissions" }
requiem-context = { path = "crates/context" }
requiem-project = { path = "crates/project" }
requiem-obsidian = { path = "crates/obsidian" }
requiem-memory = { path = "crates/memory" }
requiem-tui = { path = "crates/tui" }
requiem-cli = { path = "crates/cli" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
